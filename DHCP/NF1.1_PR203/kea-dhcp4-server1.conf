{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "enp0s3" ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,
    "multi-threading": {
      "enable-multi-threading": false
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "172.24.63.0/24",
        "pools": [ { "pool": "172.24.63.100 - 172.24.63.200" } ],
        "option-data": [
          { "name": "routers", "data": "172.24.63.1" },
          { "name": "domain-name-servers", "data": "172.24.63.10, 8.8.8.8" },
          { "name": "domain-name", "data": "shailamartinez.local" }
        ]
      }
    ],

    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
      },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [
            {
              "this-server-name": "server1",
              "mode": "hot-standby",
              "heartbeat-delay": 10000,
              "max-response-delay": 60000,
              "max-ack-delay": 5000,
              "max-unacked-clients": 0,
              "multi-threading": {
                "enable-multi-threading": false,
                "http-dedicated-listener": false,
                "http-listener-threads": 0,
                "http-client-threads": 0
              },
              "peers": [
                {
                  "name": "server1",
                  "url": "http://172.24.63.10:8000/",
                  "role": "primary"
                },
                {
                  "name": "server2",
                  "url": "http://172.24.63.11:8000/",
                  "role": "standby"
                }
              ]
            }
          ]
        }
      }
    ],

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "/var/log/kea/kea-dhcp4.log" } ],
        "severity": "INFO"
      }
    ]
  }
}